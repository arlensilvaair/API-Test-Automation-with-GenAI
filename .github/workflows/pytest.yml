name: Testes offline QA
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_local_validation.py -v --junitxml=evidence/junit-offline.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-pytest
          path: evidence/junit-offline.xml
